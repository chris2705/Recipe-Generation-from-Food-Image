{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/generate.css') }}">
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold font-outfit">Generate Recipe</h1>
        <p class="text-muted">Upload a photo of your meal or try one of our samples.</p>
    </div>

    <div class="row justify-content-center g-4">
        <div class="col-lg-8 col-xl-6">
            <div class="card shadow-sm border-0 rounded-4 h-100">
                <div class="card-body p-4 p-md-5 d-flex flex-column justify-content-center">
                    
                    <form id="upload-form" action="{{ url_for('predict') }}" method="POST" enctype="multipart/form-data">
                        
                        <div class="upload-area border-2 border-dashed rounded-4 p-5 text-center position-relative hover-bg-light transition-all" id="drop-zone">
                            <input type="file" name="imagefile" id="file-input" class="position-absolute top-0 start-0 w-100 h-100 opacity-0 cursor-pointer" accept=".jpg, .jpeg, .png">
                            
                            <div id="upload-prompt">
                                <div class="upload-icon-wrapper bg-primary-subtle text-primary rounded-circle p-4 d-inline-block mb-3">
                                    <i class="fas fa-cloud-upload-alt fs-1"></i>
                                </div>
                                <h4 class="fw-semibold">Drag & Drop Image Here</h4>
                                <p class="text-muted small mb-0">Supported formats: JPG, PNG, JPEG</p>
                                <div class="mt-3">
                                    <button type="button" class="btn btn-outline-primary rounded-pill px-4" id="browse-btn">Browse Files</button>
                                </div>
                            </div>

                            <div id="upload-preview" class="d-none">
                                <div class="position-relative d-inline-block">
                                    <img src="" alt="Preview" id="preview-image" class="img-fluid rounded-3 shadow-sm max-h-300 object-fit-cover">
                                    <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2 rounded-circle shadow" id="clear-btn">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                                <div class="mt-3">
                                    <h6 id="file-name" class="fw-bold mb-1 text-truncate">filename.jpg</h6>
                                    <p id="file-size" class="text-muted small">0 KB</p>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 text-center">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 shadow-sm hover-lift w-100 fw-bold" id="submit-btn" disabled>
                                Generate Recipe Now <i class="fas fa-magic ms-2"></i>
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/upload.js') }}"></script>
{% endblock %}
