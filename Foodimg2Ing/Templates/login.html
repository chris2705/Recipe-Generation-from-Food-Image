{% extends "base.html" %}

{% block title %}Login | AI Recipe Generator{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<section class="auth-section py-5">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">

                <div class="text-center mb-4">
                    <div class="auth-icon-wrapper mx-auto mb-3">
                        <i class="fas fa-sign-in-alt fs-2 text-primary"></i>
                    </div>
                    <h2 class="fw-bold font-outfit">Welcome Back</h2>
                    <p class="text-muted">Log in to access your recipe book</p>
                </div>

                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-4 p-md-5">
                        <form method="POST" action="{{ url_for('auth.login') }}" id="login-form" novalidate>
                            
                            <div class="mb-4">
                                <label for="email" class="form-label fw-semibold text-dark">
                                    <i class="fas fa-envelope text-primary me-1"></i> Email Address
                                </label>
                                <input type="email" class="form-control form-control-lg rounded-3" id="email" name="email" 
                                       placeholder="you@example.com" value="{{ email|default('') }}" required autofocus>
                            </div>

                            <div class="mb-4">
                                <div class="d-flex justify-content-between align-items-center">
                                    <label for="password" class="form-label fw-semibold text-dark">
                                        <i class="fas fa-lock text-primary me-1"></i> Password
                                    </label>
                                </div>
                                <div class="input-group">
                                    <input type="password" class="form-control form-control-lg rounded-start-3" id="password" name="password" 
                                           placeholder="Enter your password" required>
                                    <button class="btn btn-outline-secondary rounded-end-3" type="button" id="togglePassword" title="Show/Hide Password">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                                <label class="form-check-label text-muted" for="remember">Remember me</label>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm hover-lift">
                                <i class="fas fa-sign-in-alt me-2"></i>Log In
                            </button>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <p class="text-muted">
                        Don't have an account? 
                        <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none">Create one free</a>
                    </p>
                </div>

            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
        const pw = document.getElementById('password');
        const icon = this.querySelector('i');
        if (pw.type === 'password') {
            pw.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            pw.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    });
</script>
{% endblock %}
