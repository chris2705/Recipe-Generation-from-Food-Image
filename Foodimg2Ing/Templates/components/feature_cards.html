<!-- Feature Card Template -->
{% macro feature_card(icon, title, desc) %}
<div class="col-md-6 col-lg-3 mb-4">
    <div class="card h-100 feature-card border-0 shadow-sm text-center p-4">
        <div class="card-body">
            <div class="feature-icon-wrapper mb-3 mx-auto">
                <i class="{{ icon }} fs-2 text-primary"></i>
            </div>
            <h5 class="card-title fw-bold">{{ title }}</h5>
            <p class="card-text text-muted">{{ desc }}</p>
        </div>
    </div>
</div>
{% endmacro %}

<!-- Upcoming Feature Template -->
{% macro upcoming_feature(icon, title) %}
<div class="col-sm-6 col-md-4 col-lg-3 mb-4">
    <div class="card h-100 border border-light bg-light upcoming-card text-center p-3 position-relative overflow-hidden">
        <div class="coming-soon-badge position-absolute top-0 end-0 bg-primary text-white small px-2 py-1 rounded-bl">Coming Soon</div>
        <div class="card-body">
            <i class="{{ icon }} fs-3 text-secondary mb-2 opacity-50"></i>
            <h6 class="fw-semibold mb-0 text-secondary">{{ title }}</h6>
        </div>
    </div>
</div>
{% endmacro %}
