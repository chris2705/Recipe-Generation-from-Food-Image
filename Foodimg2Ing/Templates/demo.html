{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold font-outfit">Try a Demo</h1>
        <p class="text-muted">Select one of our sample images to see the AI Recipe Generator in action.</p>
    </div>

    <div class="row g-4 justify-content-center">
        
        <!-- Sample 1 -->
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden hover-lift transition-all">
                <img src="{{ url_for('static', filename='images/burger.jpg') }}" class="card-img-top object-fit-cover" alt="Burger" style="height: 250px;">
                <div class="card-body p-4 text-center">
                    <h5 class="fw-bold font-outfit mb-3">Burger</h5>
                    <span class="badge bg-primary-subtle text-primary mb-3">Fast Food</span>
                    <br>
                    <a href="{{ url_for('predictsample', samplefoodname='burger') }}" class="btn btn-outline-primary rounded-pill px-4 w-100 fw-semibold">
                        Try Burger <i class="fas fa-arrow-right ms-2"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Sample 2 -->
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden hover-lift transition-all">
                <img src="{{ url_for('static', filename='images/chocolate-cake.jpg') }}" class="card-img-top object-fit-cover" alt="Chocolate Cake" style="height: 250px;">
                <div class="card-body p-4 text-center">
                    <h5 class="fw-bold font-outfit mb-3">Chocolate Cake</h5>
                    <span class="badge bg-primary-subtle text-primary mb-3">Dessert</span>
                    <br>
                    <a href="{{ url_for('predictsample', samplefoodname='chocolate-cake') }}" class="btn btn-outline-primary rounded-pill px-4 w-100 fw-semibold">
                        Try Chocolate Cake <i class="fas fa-arrow-right ms-2"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Sample 3 -->
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden hover-lift transition-all">
                <img src="{{ url_for('static', filename='images/grilled-beef.jpg') }}" class="card-img-top object-fit-cover" alt="Grilled Beef" style="height: 250px;">
                <div class="card-body p-4 text-center">
                    <h5 class="fw-bold font-outfit mb-3">Grilled Beef</h5>
                    <span class="badge bg-primary-subtle text-primary mb-3">Main Course</span>
                    <br>
                    <a href="{{ url_for('predictsample', samplefoodname='grilled-beef') }}" class="btn btn-outline-primary rounded-pill px-4 w-100 fw-semibold">
                        Try Grilled Beef <i class="fas fa-arrow-right ms-2"></i>
                    </a>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center mt-5">
        <a href="{{ url_for('generate') }}" class="text-secondary text-decoration-none hover-primary">
            <i class="fas fa-cloud-upload-alt me-2"></i> Prefer to upload your own image?
        </a>
    </div>
</div>
{% endblock %}
